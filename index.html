<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>OsDino</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #090d16;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Başlangıç Ekranı */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(9, 13, 22, 0.98);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            font-family: sans-serif;
            color: white;
        }

        #play-btn {
            background-color: #22c55e;
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 26px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
            transition: transform 0.2s;
        }

        #play-btn:active {
            transform: scale(0.95);
        }

        /* Oyun İçi Arayüz */
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            font-family: sans-serif;
            color: white;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px 25px;
            border-radius: 12px;
            pointer-events: none;
            z-index: 100;
            border: 1px solid rgba(255,255,255,0.1);
        }

        #size-display {
            font-size: 22px;
            font-weight: bold;
            color: #22c55e;
        }

        #tier-display {
            font-size: 14px;
            color: #3b82f6;
            margin-top: 3px;
            font-weight: bold;
        }

        #timer-display {
            font-size: 13px;
            color: #f43f5e;
            margin-top: 5px;
            font-weight: bold;
        }

        #warning-msg {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: sans-serif;
            font-size: 30px;
            font-weight: bold;
            color: #f43f5e;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.9);
            display: none;
            z-index: 1000;
            pointer-events: none;
            text-align: center;
        }

        /* Sanal Joystick (Tablet ve Telefonlar İçin) */
        #joystick-container {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            touch-action: none;
        }

        #joystick-knob {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Yapay Zeka İsim Etiketleri */
        .ai-label {
            position: absolute;
            transform: translate(-50%, -100%);
            color: white;
            font-family: sans-serif;
            font-size: 12px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.8);
            padding: 3px 7px;
            border-radius: 4px;
            pointer-events: none;
            z-index: 10;
            white-space: nowrap;
        }

        /* Ekran Dışı Radar Göstergeleri */
        .radar-indicator {
            position: absolute;
            width: 38px;
            height: 38px;
            background: rgba(0,0,0,0.8);
            border-radius: 50%;
            display: none;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            font-size: 14px;
            font-weight: bold;
            z-index: 99;
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.2);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="start-screen">
        <h1 style="font-size: 58px; margin-bottom: 5px; text-shadow: 0 4px 12px rgba(0,0,0,0.7); color: #22c55e; font-family: sans-serif; letter-spacing: 2px;">OsDino</h1>
        <p style="color: #9ca3af; margin-bottom: 30px; font-size: 18px; font-family: sans-serif; font-style: italic;">Her 10 Metrede Yeniden Küçül, Binaları Yok Et!</p>
        <button id="play-btn">OYUNA BAŞLA</button>
    </div>

    <div id="ui">
        <div id="size-display">Boyut: <span id="size-val">1.00</span>m</div>
        <div id="tier-display">Kademe: <span id="tier-val">Normal Dino</span></div>
        <div id="timer-display">Evrime Kalan Süre: <span id="timer-val">20</span>s</div>
    </div>

    <div id="warning-msg">Boyutun Yetersiz!</div>

    <div id="joystick-container">
        <div id="joystick-knob"></div>
    </div>

    <button id="admin-btn" style="position: absolute; top: 20px; right: 20px; background-color: #eab308; color: white; border: none; padding: 12px 20px; font-weight: bold; border-radius: 8px; cursor: pointer; z-index: 1000; font-family: sans-serif;">Admin Panel</button>

    <div id="admin-controls" style="display: none; position: absolute; top: 80px; right: 20px; background: rgba(0,0,0,0.95); color: white; padding: 15px; border-radius: 8px; z-index: 1000; font-family: sans-serif; border: 2px solid #eab308;">
        <h4 style="margin: 0 0 10px 0; color: #eab308; text-align: center;">Dino Kontrol</h4>
        <div style="display: flex; gap: 5px;">
            <input type="number" id="admin-size-input" value="1" step="5" style="width: 80px; padding: 8px; border-radius: 4px; border: 1px solid #4a5568; background: #2d3748; color: white; font-weight: bold;">
            <button id="admin-apply-btn" style="background: #22c55e; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;">Uygula</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
