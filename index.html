<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OsDino</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="start-screen">
        <div id="start-content">
            <h1 id="start-title">OSDINO</h1>
            <p id="start-sub">Şehri Ye, Rakiplerini Atlat, En Büyük Canavar Ol!</p>
            <button id="play-btn">OYUNA BAŞLA</button>
        </div>
    </div>

    <div id="ui">
        <div id="score-container">
            <div id="score-title">OSDINO BOYUTU</div>
            <div id="score-board"><span id="size-val">1.00</span><span class="unit">m</span></div>
        </div>
    </div>

    <div id="warning-msg"></div>

    <div id="joystick-container">
        <div id="joystick-knob"></div>
    </div>

    <script src="game.js"></script>
</body>
</html>
